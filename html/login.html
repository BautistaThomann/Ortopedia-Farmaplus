<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logo-farma-ortopedia.webp" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="../img/logo-farmacia-footer.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Ortopedia Farmaplus - Login</title>
</head>
<body>
    <div class="cont-logo">
        <img src="../img/logo-farma-ortopedia.webp" alt="logo farmacia">
    </div>
    <div class="separador"></div>
    <main class="main-login">
        <h1 class="h1-login">Login</h1>
        <form id="login-form">
            <p>
                <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>
            </p>
            <p>
                <input type="password" id="password" name="password" placeholder="Contraseña" required>
            </p>
            <p>
                <input class="iniciar-sesion" type="submit" value="Iniciar Sesión">
            </p>
        </form>
    </main>

    <script src="../js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
